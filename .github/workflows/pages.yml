name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf

      - name: Generate downloadable Markdown and PDFs
        run: |
          mkdir -p _site/downloads
          python <<'PY'
          from pathlib import Path
          import subprocess

          files = {
              "COMMON_PROTOCOLS.md": "common-protocols",
              "SAFETY_TRAINING_CHECKLIST.md": "safety-training-checklist",
              "LAB_SCHEDULE.md": "lab-availability",
          }

          def strip_front_matter(text: str) -> str:
              if not text.startswith("---\n"):
                  return text
              end = text.find("\n---\n", 4)
              if end == -1:
                  return text
              return text[end + len("\n---\n"):]

          downloads_dir = Path("_site/downloads")

          for source_name, slug in files.items():
              source_path = Path(source_name)
              body = strip_front_matter(source_path.read_text(encoding="utf-8")).lstrip()
              markdown_path = downloads_dir / f"{slug}.md"
              markdown_path.write_text(body, encoding="utf-8")

              title = next(
                  (
                      line[2:].strip()
                      for line in body.splitlines()
                      if line.startswith("# ")
                  ),
                  slug.replace("-", " ").title(),
              )

              subprocess.run(
                  [
                      "pandoc",
                      str(markdown_path),
                      "--from=markdown",
                      "--to=pdf",
                      "--pdf-engine=wkhtmltopdf",
                      "--metadata",
                      f"title={title}",
                      "--output",
                      str(downloads_dir / f"{slug}.pdf"),
                  ],
                  check=True,
              )
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
