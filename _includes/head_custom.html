<style>
  /* ─── Design Tokens ───────────────────────────────────────────
     Mirror the tokens defined in _layouts/home.html so that all
     inner pages (layout: default / Just the Docs) share the same
     brand palette and accessibility baseline.
  ──────────────────────────────────────────────────────────────── */
  :root {
    --brand-red:       #CC0000;   /* NC State Red */
    --brand-red-bright:#E03A3E;   /* brighter accent red */
    --brand-red-dark:  #990000;   /* darker red for hover */
    --brand-dark:      #111111;
    --brand-mid:       #2b2b2b;
    --brand-light:     #f4f4f4;
    --text:            #1a1a1a;
    --muted:           #595959;   /* 7:1 on white — WCAG AAA */
    --white:           #FFFFFF;
    --focus-ring:      #CC0000;   /* matches home.html focus ring */
    --focus-ring-soft: rgba(204, 0, 0, 0.18);
  }

  /* ─── Global focus style ──────────────────────────────────────
     Replace the default Just the Docs focus outline with the
     high-contrast brand focus ring.
  ──────────────────────────────────────────────────────────────── */
  :focus-visible {
    outline: 3px solid var(--focus-ring) !important;
    outline-offset: 3px !important;
    box-shadow: 0 0 0 6px var(--focus-ring-soft) !important;
  }
  :focus:not(:focus-visible) {
    outline: none !important;
    box-shadow: none !important;
  }

  /* ─── Brand link color ────────────────────────────────────────
     Just the Docs defaults to purple; override to brand red.
  ──────────────────────────────────────────────────────────────── */
  .main-content a {
    color: var(--brand-red);
  }
  .main-content a:hover {
    color: #990000;
  }

  /* ─── Light navigation sidebar ───────────────────────────────
     Override Just the Docs sidebar and top-bar with a light
     background and high-contrast text/links.
  ──────────────────────────────────────────────────────────────── */

  /* Sidebar background */
  .side-bar,
  nav.site-nav,
  .site-header {
    background-color: #f1f3f5 !important;
    border-right-color: #d0d7de !important;
  }

  /* Site title / logo in sidebar */
  .site-title {
    color: var(--brand-dark) !important;
    font-weight: 700;
  }
  .site-title:hover {
    background-color: rgba(224, 58, 62, 0.08) !important;
    color: var(--brand-dark) !important;
  }

  /* Top navigation bar (mobile) */
  .site-header .site-button {
    color: var(--brand-dark) !important;
  }

  /* All sidebar nav links */
  .nav-list .nav-list-link {
    color: var(--brand-dark) !important;
  }
  .nav-list .nav-list-link:hover,
  .nav-list .nav-list-link:focus {
    color: #000000 !important;
    background-color: rgba(224, 58, 62, 0.10) !important;
  }

  /* Active / current page link */
  .nav-list .nav-list-link.active {
    color: #000000 !important;
    font-weight: 700;
    border-left: 3px solid var(--brand-red-bright);
    background-color: rgba(224, 58, 62, 0.14) !important;
  }

  /* Section headers inside nav */
  .nav-list-title {
    color: #525252 !important;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    font-size: 0.75rem;
  }

  /* Auxiliary links (GitHub link, search bar area) */
  .aux-nav-list-item a,
  .aux-nav a {
    color: var(--brand-dark) !important;
  }
  .aux-nav-list-item a:hover,
  .aux-nav a:hover {
    color: #000000 !important;
  }

  /* Search input in dark sidebar */
  .search-input {
    background-color: #ffffff !important;
    color: var(--brand-dark) !important;
    border-color: #c5ccd3 !important;
  }
  .search-input::placeholder {
    color: #6b7280 !important;
  }

  /* ─── Sidebar active and hover link ──────────────────────────── */

  /* ─── Inline code and table accents ──────────────────────────── */
  .main-content code {
    border-color: #d1d5db;
  }

  /* ─── Reduced motion ──────────────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }
  }
</style>
